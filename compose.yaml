services:
  db:
    image: postgres:16-alpine
    container_name: adhera-db
    environment:
      POSTGRES_USER: adhera
      POSTGRES_PASSWORD: adhera_local_only
      POSTGRES_DB: adhera
    ports:
      - "5433:5432"
    volumes:
      - adhera-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhera -d adhera"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  adhera-db-data:
